limit_req_zone $binary_remote_addr zone=geometry:10m rate=3r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    location = /api/forme/solidify {
        limit_req zone=geometry burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://geometry:8787;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
    }
    location /api/forme/ {
        proxy_pass http://geometry:8787;
        proxy_set_header Host $host;
    }
    location /forme/ { try_files $uri $uri/ =404; }
    location / { try_files $uri $uri/ /index.html; }
}

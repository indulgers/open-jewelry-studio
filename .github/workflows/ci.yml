name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Verify the serverless entry loads under Node
        run: |
          node --experimental-transform-types --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import api from './api/jewelry-admin.ts';
          const reply = await api.fetch(new Request('http://localhost/api/model-admin/community/session'));
          assert.equal(reply.status, 503);
          assert.deepEqual(await reply.json(), {error:'社区存储尚未配置。'});
          NODE
      - run: npm test
      - run: npm run build:public
      - name: Verify public assets
        run: |
          test -f dist/index.html
          # Public builds intentionally omit private production models and media (served via R2).
          test ! -e dist/models
          test ! -e dist/media
          test ! -e dist/models/webgi
          test ! -e dist/models/reference
          test ! -e dist/environments/reference
          test ! -e dist/media/sample

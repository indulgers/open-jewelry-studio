name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:public
      - name: Verify public assets
        run: |
          test -f dist/index.html
          # Public builds intentionally omit private production models and media (served via R2).
          test ! -e dist/models
          test ! -e dist/media
          test ! -e dist/models/webgi
          test ! -e dist/models/reference
          test ! -e dist/environments/reference
          test ! -e dist/media/sample

name: Motif Visual Acceptance
on:
  pull_request:
    paths:
      - 'src/motif/**'
      - 'public/motif-lab/**'
      - 'scripts/motif-visual-capture.mjs'
      - '.github/workflows/motif-visual.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.58.0
      - name: Capture actual browser views
        run: node scripts/motif-visual-capture.mjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motif-v02-browser-evidence
          path: visual-artifacts/
          if-no-files-found: warn

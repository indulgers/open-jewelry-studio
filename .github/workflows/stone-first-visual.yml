name: Stone-first browser review
on:
  workflow_dispatch:
  push:
    branches: [feat/stone-first-reference-diy]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - name: Start the preview server
        run: |
          npm run dev -- --port 5179 > /tmp/stone-first-vite.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -sf http://127.0.0.1:5179/#/stonefirst >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/stone-first-vite.log
          exit 1
      - name: Take actual WebGL screenshots
        run: node scripts/stone-first-capture.mjs
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stone-first-webgl-screenshots
          path: artifacts/stone-first/*.png
          if-no-files-found: warn

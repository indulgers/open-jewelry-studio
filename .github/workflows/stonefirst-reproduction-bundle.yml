name: Stone-first reproduction bundle
on:
  workflow_dispatch:
  push:
    branches: [feat/stone-first-reference-diy]
    paths: [.github/workflows/stonefirst-reproduction-bundle.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package tracked application and installed dependencies
        run: |
          mkdir -p /tmp/stone-first-bundle
          git archive HEAD | tar -xf - -C /tmp/stone-first-bundle
          mv node_modules /tmp/stone-first-bundle/node_modules
          git rev-parse HEAD > /tmp/stone-first-bundle/REPRODUCTION_COMMIT.txt
          tar -czf /tmp/stone-first-runtime.tar.gz -C /tmp/stone-first-bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: stone-first-reproduction-runtime
          path: /tmp/stone-first-runtime.tar.gz
          retention-days: 2
          compression-level: 0

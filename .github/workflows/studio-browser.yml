name: Studio browser acceptance
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/model-admin/**'
      - 'scripts/studio-browser-acceptance.mjs'
      - '.github/workflows/studio-browser.yml'
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright-core@1.58.0
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: node scripts/studio-browser-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-evidence
          path: visual-artifacts/
          if-no-files-found: warn
